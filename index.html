<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Dart Yoza Ulpia Rafila</title>
</head>
<body>
  <h1>Program Dart - Fibonacci & Perkenalan</h1>

  <pre id="output"></pre>

  <script type="application/dart">
    void main() {
      const i = 20;

      final out = StringBuffer();
      out.writeln('fibonacci($i) = ${fibonacci(i)}');
      out.writeln('Halo Nama Saya Yoza Ulpia Rafila');

      // tampilkan di <pre>
      final pre = document.getElementById('output');
      pre?.textContent = out.toString();
    }

    int fibonacci(int n) {
      return n < 2 ? n : (fibonacci(n - 1) + fibonacci(n - 2));
    }
  </script>

  <!-- Dart SDK untuk browser -->
  <script defer src="https://dart.dev/tools/dart.js"></script>
</body>
</html>
